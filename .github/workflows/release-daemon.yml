# Build per-platform daemon binaries on tag push and attach them to the
# GitHub release. The plugin's install path (packages/plugin/scripts/
# daemon-install.ts) prefers a binary from the latest matching release;
# if download fails (no internet, no asset for the user's platform),
# it falls back to `bun run daemon.js` so install never wedges.
#
# Trigger: tag push matching v*.*.*  (e.g. `git tag v1.0.59 && git push --tags`)
# Output: binaries attached to the corresponding release. The release must
# already exist (created by `gh release create v<version> ...`); this
# workflow only uploads, it does not create the release.

name: release-daemon

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  create-release:
    name: create release for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: create release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  build:
    needs: create-release
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: mneme-daemon-darwin-arm64
          - target: bun-darwin-x64
            asset: mneme-daemon-darwin-x64
          - target: bun-linux-x64
            asset: mneme-daemon-linux-x64
          - target: bun-linux-arm64
            asset: mneme-daemon-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install workspace deps
        run: bun install --frozen-lockfile
      - name: cross-compile daemon
        run: |
          mkdir -p dist/binaries
          cd dist/binaries
          bun build \
            --compile \
            --target=${{ matrix.target }} \
            ../../packages/daemon/src/index.ts \
            --outfile=${{ matrix.asset }}
          ls -lh ${{ matrix.asset }}
      - name: upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/binaries/${{ matrix.asset }}" \
            --clobber
