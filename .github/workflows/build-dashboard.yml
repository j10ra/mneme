name: build-dashboard
on:
  push:
    branches: [main]
    paths:
      - 'packages/plugin/dashboard/src/**'
      - 'packages/plugin/dashboard/index.html.template'
      - 'packages/plugin/dashboard/build.ts'
      - 'packages/plugin/dashboard/package.json'
      - 'packages/plugin/dashboard/tsconfig.json'
      - '.github/workflows/build-dashboard.yml'

# Allow this workflow to push the rebuilt dist/ back to main.
permissions:
  contents: write

# Don't queue parallel builds — only the latest source matters.
concurrency:
  group: build-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dashboard deps
        working-directory: packages/plugin/dashboard
        run: bun install --frozen-lockfile || bun install

      - name: Build dashboard
        working-directory: packages/plugin/dashboard
        run: bun run build

      - name: Commit dist/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `-f` forces past .gitignore so the CI-only artifacts land
          # in the tree without polluting local dev state.
          git add -f packages/plugin/dashboard/dist
          if git diff --staged --quiet; then
            echo "No dashboard changes to commit"
          else
            git commit -m "(ci): rebuild dashboard bundle [skip ci]"
            git push
          fi
